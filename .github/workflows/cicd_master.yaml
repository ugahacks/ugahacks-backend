name: Master Branch CI/CD
on:
  push:
    branches:
      - "master"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  DEPLOY_ENV: prod
  CI: true
  AR_HOST: us-central1-docker.pkg.dev
  AR_REPO: mybyte-prod

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Lint Python Code
        run: python -V

  # eslint:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4

  #     - name: Setup Node (with Yarn cache)
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: "20"
  #         cache: "yarn"
  #         cache-dependency-path: yarn.lock

  #     - name: Enable Corepack + pin Yarn 4.12.0
  #       run: |
  #         corepack enable
  #         corepack prepare yarn@4.12.0 --activate
  #         yarn --version

  #     - name: Install project dependencies (Yarn 4)
  #       run: yarn install --immutable

  #     - name: Lint (mybyte workspace)
  #       run: |
  #         echo "yarn version: $(yarn --version)"
  #         yarn workspace mybyte run lint

  pytest:
    needs: flake8
    runs-on: ubuntu-latest
    steps:
      - name: Test Python Code
        run: echo "PYTHON UNIT TESTING COMPLETE"

  jest:
    needs: flake8 # removed eslint dependency for now
    runs-on: ubuntu-latest
    steps:
      - name: Test Typescript Code
        run: echo "TYPESCRIPT UNIT TESTING COMPLETE"

  deploy:
    needs: [flake8, pytest, jest]
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v1"
        with:
          workload_identity_provider: "projects/436222925278/locations/global/workloadIdentityPools/pool-ugahacks-backend/providers/provider-ugahacks-backend"
          service_account: "ugahacks-cicd@ugahacks-core-infra.iam.gserviceaccount.com"

      - name: "Setup Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v1"

      - name: Authorize Docker push (Artifact Registry)
        run: gcloud auth configure-docker --quiet ${{ env.AR_HOST }}
      - name: Get changed files
        id: file_changes
        uses: tj-actions/changed-files@v45

      - name: Output Changed Files
        run: |
          echo "Changed Files (~/files.csv):"
          cat $HOME/files.csv

      - name: Build and Push mybyte Container
        run: |-
          echo "mybyte changed, building ..."
          IMAGE_URI="${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/mybyte-${{ env.DEPLOY_ENV }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" projects/mybyte
          docker push "$IMAGE_URI"
        if: contains(steps.file_changes.outputs.all_changed_files, 'projects/mybyte/')

      - name: Deploy mybyte to Cloud Run
        id: deploy_mybyte
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: mybyte-${{ env.DEPLOY_ENV }}
          image: ${{ env.AR_HOST }}/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/mybyte-${{ env.DEPLOY_ENV }}:${{ github.sha }}
          region: ${{ env.REGION }}
        if: contains(steps.file_changes.outputs.all_changed_files, 'projects/mybyte/')

      - name: mybyte Post Deployment
        run: |-
          echo "Active URL:"
          echo ${{ steps.deploy_mybyte.outputs.url }}
        if: contains(steps.file_changes.outputs.all_changed_files, 'projects/mybyte/')
